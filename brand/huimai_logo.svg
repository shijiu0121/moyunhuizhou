<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .card   { fill:#F7F2E9; stroke:#241B15; stroke-width:12; }
      .mist   { fill:#BCAE98; }
      .ink    { fill:#241B15; }
      .brick  { stroke:#786452; stroke-width:6; }
      .seal   { fill:#A03A2E; }
      .sealTx { fill:#FAF5EC; }
      .pulse  { fill:none; stroke:#A03A2E; stroke-width:22; stroke-linecap:round; stroke-linejoin:round; }
      .arch   { fill:none; stroke:#F7F2E9; stroke-width:18; }
      .mainTx { font-family:'STKaiti','KaiTi','KaiTi_GB2312','SimSun',serif; font-size:200px; fill:#241B15; text-anchor:middle; }
    </style>
  </defs>

  <!-- 底卡：宣纸圆角方 -->
  <rect class="card" x="24" y="24" width="976" height="976" rx="200"/>

  <!-- 右上角小朱砂印章「印」 -->
  <g transform="translate(800 92)">
    <rect width="88" height="88" class="seal"/>
    <text x="44" y="56" class="sealTx" font-family="SimHei,SimSun,serif" font-size="46" text-anchor="middle">印</text>
  </g>

  <!-- 后景墙（淡墨，错落） -->
  <polygon class="mist" points="336,548 336,404 448,404 448,322 560,322 560,236 680,236 680,322 762,322 762,404 806,404 806,548"/>

  <!-- 前景马头墙（浓墨，台阶轮廓） -->
  <polygon class="ink" points="228,556 228,428 352,428 352,342 466,342 466,244 612,244 612,342 724,342 724,428 808,428 808,556"/>

  <!-- 马头墙顶部小檐线（提亮） -->
  <path class="brick" d="M352 342 L352 342 M466 342 L466 342 M612 342 L612 342 M724 342 L724 342 M352 428 L466 428 M612 428 L724 428"/>

  <!-- 券门洞（半圆门） -->
  <path class="arch" d="M478 556 A61 61 0 0 1 600 556" />

  <!-- 朱砂「脉」线：起伏心跳线，穿过马头墙 -->
  <polyline class="pulse" points="246,512 332,474 424,546 512,462 604,532 700,456 790,512"/>

  <!-- 脉线末端朱砂圆点（句读） -->
  <circle class="seal" cx="800" cy="518" r="18"/>

  <!-- 主标：徽脉 -->
  <text class="mainTx" x="390" y="758">徽</text>
  <text class="mainTx" x="634" y="758">脉</text>

  <!-- 徽脉下方朱砂横杠（点睛） -->
  <line x1="392" y1="888" x2="632" y2="888" stroke="#A03A2E" stroke-width="14" stroke-linecap="round"/>
</svg>
